apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      timeout: 60
      maxLines: 10001
      # Alloy ships each log as JSON; the OTLP trace id is in "traceid".
      derivedFields:
        - name: TraceID
          datasourceUid: jaeger
          matcherRegex: '"traceid":"(\w+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
