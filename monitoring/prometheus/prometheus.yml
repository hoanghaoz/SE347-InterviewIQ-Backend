global:
  scrape_interval: 1m
  scrape_timeout: 10s
  evaluation_interval: 1m

storage:
  tsdb:
    out_of_order_time_window: 10m

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'interviewiq-backend'
    static_configs:
      - targets: ['interviewiq-backend:3000']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
