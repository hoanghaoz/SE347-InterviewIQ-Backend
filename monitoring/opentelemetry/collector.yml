receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  otlp_grpc/alloy:
    endpoint: grafana-alloy:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/alloy]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/alloy]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/alloy]
